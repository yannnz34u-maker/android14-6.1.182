
name: Wowo-Quantum - Android 14 GKI 6.1.182

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Select Clang toolchain"
        type: choice
        required: true
        default: aosp-clang-23
        options:
          - google
          - aosp-clang-23
          - llvm-23.1.4
          - neutron-06092026

      enable_lto:
        description: "Enable ThinLTO"
        type: boolean
        required: true
        default: true

      enable_pgo:
        description: "Enable AutoFDO PGO (requires profile)"
        type: boolean
        required: true
        default: false

      pgo_profile:
        description: "AutoFDO profile path inside kernel repository"
        type: string
        required: false
        default: "profiles/kernel.afdo"

      enable_mlgo:
        description: "Enable MLGO inliner (requires compatible model)"
        type: boolean
        required: true
        default: false

      mlgo_model:
        description: "MLGO model path inside kernel repository"
        type: string
        required: false
        default: "profiles/mlgo-inliner-model"

      enable_bolt:
        description: "Enable experimental BOLT post-link optimization"
        type: boolean
        required: true
        default: false

      bolt_profile:
        description: "BOLT profile path inside kernel repository"
        type: string
        required: false
        default: "profiles/kernel.fdata"

permissions:
  contents: read

jobs:
  build:
    name: Wowo-Quantum GKI 6.1.182 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KBUILD_BUILD_USER: userbuild
      KBUILD_BUILD_HOST: yannn34u

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: yannnz34u-maker/android14-6.1.182
          ref: main
          fetch-depth: 0
          path: kernel

      - name: Disable Automatic Git Kernel Suffix
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          : > .scmversion

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== COMMIT ====="
          git log -1 --oneline

          VERSION="$(make -s kernelversion)"
          echo "Kernel version: $VERSION"

          if [ "$VERSION" != "6.1.182" ]; then
            echo "::error::Expected 6.1.182, found $VERSION"
            exit 1
          fi

          test -f Makefile
          test -d arch/arm64
          test -d scripts

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git curl wget \
            zip unzip jq libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip pahole lz4 zstd \
            device-tree-compiler rsync ccache xz-utils

      - name: Download Selected Clang Toolchain
        shell: bash
        env:
          SELECTED_COMPILER: ${{ inputs.compiler }}
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/clang-toolchain"
          mkdir -p "$CLANG_DIR"

          case "$SELECTED_COMPILER" in
            google)
              echo "Selected: Google Android 14 Clang r487747c"

              CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz"

              curl -fL --retry 5 "$CLANG_URL" \
                -o "$RUNNER_TEMP/google-clang.tar.gz"

              tar -xzf "$RUNNER_TEMP/google-clang.tar.gz" \
                -C "$CLANG_DIR"
              ;;

            aosp-clang-23)
              echo "Selected: Official AOSP Clang r614150"

              CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r614150.tar.gz"

              curl -fL --retry 5 "$CLANG_URL" \
                -o "$RUNNER_TEMP/aosp-clang-23.tar.gz"

              tar -xzf "$RUNNER_TEMP/aosp-clang-23.tar.gz" \
                -C "$CLANG_DIR"
              ;;

            llvm-23.1.4)
              echo "Selected: Official LLVM 23.1.4"

              LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-Linux-X64.tar.xz"

              curl -fL --retry 5 "$LLVM_URL" \
                -o "$RUNNER_TEMP/llvm-23.1.4.tar.xz"

              tar -xJf "$RUNNER_TEMP/llvm-23.1.4.tar.xz" \
                -C "$CLANG_DIR"
              ;;

            neutron-06092026)
              echo "Selected: Neutron Clang 06092026"

              NEUTRON_DIR="$RUNNER_TEMP/neutron-clang"
              mkdir -p "$NEUTRON_DIR"

              curl -fL --retry 5 \
                "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" \
                -o "$NEUTRON_DIR/antman"

              chmod +x "$NEUTRON_DIR/antman"

              cd "$NEUTRON_DIR"

              bash antman \
                -S=06092026 \
                --noprogress \
                --noaxel

              CLANG_DIR="$NEUTRON_DIR"
              ;;

            *)
              echo "::error::Unknown compiler: $SELECTED_COMPILER"
              exit 1
              ;;
          esac

          CLANG_BIN="$(find "$CLANG_DIR" \
            \( -type f -o -type l \) \
            -name clang -print -quit | xargs -r dirname)"

          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::clang executable not found"
            find "$CLANG_DIR" -maxdepth 6 -name 'clang*' -print
            exit 1
          fi

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy; do
            if [ ! -x "$CLANG_BIN/$tool" ]; then
              echo "::error::Required tool missing: $tool"
              exit 1
            fi
          done

          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Verify Selected Clang
        shell: bash
        run: |
          set -euo pipefail

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-objcopy --version

      - name: Prepare Optimization Profiles
        shell: bash
        env:
          ENABLE_PGO: ${{ inputs.enable_pgo }}
          PGO_PROFILE: ${{ inputs.pgo_profile }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
          MLGO_MODEL: ${{ inputs.mlgo_model }}
          ENABLE_BOLT: ${{ inputs.enable_bolt }}
          BOLT_PROFILE: ${{ inputs.bolt_profile }}
        run: |
          set -euo pipefail
          cd kernel

          if [ "$ENABLE_PGO" = "true" ]; then
            if [ ! -s "$PGO_PROFILE" ]; then
              echo "::error::AutoFDO profile not found: $PGO_PROFILE"
              exit 1
            fi

            echo "PGO_PROFILE=$GITHUB_WORKSPACE/kernel/$PGO_PROFILE" \
              >> "$GITHUB_ENV"
          fi

          if [ "$ENABLE_MLGO" = "true" ]; then
            if [ ! -s "$MLGO_MODEL" ]; then
              echo "::error::MLGO model not found: $MLGO_MODEL"
              exit 1
            fi

            echo "MLGO_MODEL=$GITHUB_WORKSPACE/kernel/$MLGO_MODEL" \
              >> "$GITHUB_ENV"
          fi

          if [ "$ENABLE_BOLT" = "true" ]; then
            if [ ! -s "$BOLT_PROFILE" ]; then
              echo "::error::BOLT profile not found: $BOLT_PROFILE"
              exit 1
            fi

            if ! command -v llvm-bolt >/dev/null 2>&1; then
              echo "::error::llvm-bolt is not available in selected toolchain"
              exit 1
            fi

            echo "BOLT_PROFILE=$GITHUB_WORKSPACE/kernel/$BOLT_PROFILE" \
              >> "$GITHUB_ENV"
          fi

      - name: Configure GKI Defconfig
        shell: bash
        env:
          ENABLE_LTO: ${{ inputs.enable_lto }}
          ENABLE_PGO: ${{ inputs.enable_pgo }}
        run: |
          set -euo pipefail
          cd kernel

          rm -f localversion localversion.*
          : > .scmversion

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "" \
            -d LOCALVERSION_AUTO

          if [ "$ENABLE_LTO" = "true" ]; then
            echo "Enabling ThinLTO"

            ./scripts/config --file out/.config \
              -e LTO \
              -e LTO_CLANG \
              -e LTO_CLANG_THIN \
              -d LTO_NONE \
              -d LTO_CLANG_FULL
          else
            echo "Disabling LTO"

            ./scripts/config --file out/.config \
              -d LTO \
              -d LTO_CLANG \
              -d LTO_CLANG_THIN \
              -e LTO_NONE
          fi

          if [ "$ENABLE_PGO" = "true" ]; then
            ./scripts/config --file out/.config \
              -e AUTOFDO_CLANG
          else
            ./scripts/config --file out/.config \
              -d AUTOFDO_CLANG
          fi

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            olddefconfig

          echo "===== CONFIG CHECK ====="
          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO|CONFIG_LTO|CONFIG_AUTOFDO_CLANG' \
            out/.config || true

          if [ "$ENABLE_PGO" = "true" ]; then
            if ! grep -q '^CONFIG_AUTOFDO_CLANG=y' out/.config; then
              echo "::error::Source does not support CONFIG_AUTOFDO_CLANG"
              exit 1
            fi
          fi

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          echo "Kernel release: $RELEASE"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Unexpected kernel release: $RELEASE"
            exit 1
          fi

      - name: Compile Kernel Image and Modules
        shell: bash
        env:
          ENABLE_PGO: ${{ inputs.enable_pgo }}
          ENABLE_MLGO: ${{ inputs.enable_mlgo }}
        run: |
          set -euo pipefail
          cd kernel
          : > .scmversion

          MAKE_ARGS=()

          if [ "$ENABLE_PGO" = "true" ]; then
            MAKE_ARGS+=(
              "CLANG_AUTOFDO_PROFILE=$PGO_PROFILE"
            )
          fi

          if [ "$ENABLE_MLGO" = "true" ]; then
            echo "Applying experimental MLGO inliner flags"

            MAKE_ARGS+=(
              "KCFLAGS=-mllvm -enable-ml-inliner -mllvm -ml-inliner-model=$MLGO_MODEL"
            )
          fi

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            "${MAKE_ARGS[@]}" \
            Image modules

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo "===== IMAGE SIZE ====="
          ls -lh "$IMAGE"

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Kernel release mismatch: $RELEASE"
            exit 1
          fi

      - name: BOLT Post-Link Optimization
        if: ${{ inputs.enable_bolt }}
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          VMLINUX="out/vmlinux"
          BOLT_OUTPUT="out/vmlinux.bolt"

          if [ ! -s "$VMLINUX" ]; then
            echo "::error::vmlinux not found"
            exit 1
          fi

          llvm-bolt "$VMLINUX" \
            -o "$BOLT_OUTPUT" \
            -data="$BOLT_PROFILE" \
            -reorder-blocks=ext-tsp \
            -reorder-functions=cdsort \
            -split-functions \
            -split-all-cold \
            -dyno-stats

          if [ ! -s "$BOLT_OUTPUT" ]; then
            echo "::error::BOLT output was not generated"
            exit 1
          fi

          echo "BOLT optimized vmlinux generated."
          echo "::warning::BOLT output is experimental; original boot Image is retained."

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() { '
          kernel.string=Quantum wowoLTS GKI 6.1.182
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print ''
          ui_print '   _____                      _                 _ '
          ui_print '  /  _  \  _   _   __ _  _ __ | |_  _   _  _ __ | |'
          ui_print '  | | | | | | | | / _` ||  _ \| __|| | | ||  _ \| |'
          ui_print '  | |_| | | |_| || (_| || | | | |_ | |_| || | | | |'
          ui_print '  \_____/  \__,_| \__,_||_| |_|\__| \__,_||_| |_|_|'
          ui_print ''
          ui_print '       __      __  ____  __        _____  _____'
          ui_print '       \ \    / / / __ \ \ \      / / _ \|_   _|'
          ui_print '        \ \  / / | |  | | \ \ /\ / / | | | | |'
          ui_print '         \ \/ /  | |  | |  \ V  V /| |_| | | |'
          ui_print '          \__/    \____/    \_/\_/  \___/  |_|'
          ui_print ''
          ui_print '  -----------------------------------------------'
          ui_print '     QUANTUM wowoLTS | ANDROID 14 | GKI 6.1'
          ui_print '  -----------------------------------------------'
          ui_print ''

          split_boot;
          flash_boot;

          ui_print ''
          ui_print '  ========================================='
          ui_print '              BOOOOM!!!'
          ui_print '               COOL YOU'
          ui_print '  ========================================='
          ui_print ''
          ui_print '       QUANTUM wowoLTS'
          ui_print '       KERNEL FLASH SUCCESSFUL'
          ui_print '  ========================================='
          ui_print ''
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd AnyKernel3

          zip -r9 \
            ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

          test -s ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wowo-Quantum-GKI-6.1.182
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/vmlinux
            release/Wowo-Quantum-Malachite-GKI-6.1.182.zip
          retention-days: 14
