
name: Wowo-Quantum - Android 14 GKI 6.1.182 + KSUN + SUSFS

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Select Clang toolchain"
        type: choice
        required: true
        default: aosp-clang-r614150
        options:
          - google
          - aosp-clang-r614150
          - llvm-23.1.4
          - neutron-06092026

permissions:
  contents: read

jobs:
  build:
    name: Wowo-Quantum GKI 6.1.182 + KSUN + SUSFS + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KBUILD_BUILD_USER: userbuild
      KBUILD_BUILD_HOST: yannn34u

    steps:
      # ==========================================
      # CHECKOUT KERNEL
      # ==========================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: yannnz34u-maker/android14-6.1.182
          ref: main
          fetch-depth: 0
          path: kernel

      # ==========================================
      # VERIFY SOURCE VERSION
      # ==========================================

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== COMMIT ====="
          git log -1 --oneline

          VERSION="$(make -s kernelversion)"

          echo "Kernel version: $VERSION"

          if [ "$VERSION" != "6.1.182" ]; then
            echo "::error::Expected kernel 6.1.182, found $VERSION"
            exit 1
          fi

          test -f Makefile
          test -d arch/arm64
          test -d scripts

          echo "Kernel source verified"

      # ==========================================
      # BUILD DEPENDENCIES
      # ==========================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential flex git curl wget \
            zip unzip jq libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip pahole lz4 zstd \
            device-tree-compiler rsync ccache xz-utils \
            libxml2-utils

      # ==========================================
      # KERNELSU-NEXT
      # ==========================================

      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          echo "===== DOWNLOAD KSUN SETUP ====="

          curl -fLSs --retry 5 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o "$RUNNER_TEMP/ksun-setup.sh"

          echo "===== INSTALL KSUN ====="

          bash "$RUNNER_TEMP/ksun-setup.sh" next

          echo "===== VERIFY KSUN ====="

          if [ ! -e drivers/kernelsu ]; then
            echo "::error::KernelSU-Next drivers/kernelsu was not created"
            find . -maxdepth 4 -iname '*kernelsu*' -print
            exit 1
          fi

          KSUN_KERNEL_DIR="$(realpath drivers/kernelsu)"

          echo "KernelSU kernel source:"
          echo "$KSUN_KERNEL_DIR"

          if [ ! -f "$KSUN_KERNEL_DIR/Kconfig" ]; then
            echo "::error::KernelSU Kconfig not found"
            exit 1
          fi

          echo "KernelSU-Next integrated successfully"

      # ==========================================
      # CLONE SUSFS
      # ==========================================

      - name: Clone Official SUSFS
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          echo "===== SUSFS BRANCH ====="
          git -C susfs4ksu branch --show-current

          echo "===== SUSFS COMMIT ====="
          git -C susfs4ksu log -1 --oneline

          echo "===== SUSFS PATCH FILES ====="
          find susfs4ksu/kernel_patches \
            -maxdepth 3 -type f -print

      # ==========================================
      # APPLY SUSFS KERNEL PATCH
      # ==========================================

      - name: Apply SUSFS GKI 6.1 Kernel Patch
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"

          cd "$KERNEL_DIR"

          echo "===== SELECT SUSFS PATCH ====="

          GKI_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android14-6.1_GKI.patch"
          GENERIC_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          if [ -f "$GKI_PATCH" ]; then
            SUSFS_PATCH="$GKI_PATCH"
            echo "Using GKI-specific patch"
          elif [ -f "$GENERIC_PATCH" ]; then
            SUSFS_PATCH="$GENERIC_PATCH"
            echo "Using generic GKI 6.1 patch"
          else
            echo "::error::SUSFS GKI 6.1 patch not found"
            find "$SUSFS_DIR/kernel_patches" -type f -print
            exit 1
          fi

          echo "Selected patch: $SUSFS_PATCH"

          echo "===== COPY SUSFS SOURCE FILES ====="

          if [ ! -d "$SUSFS_DIR/kernel_patches/fs" ]; then
            echo "::error::SUSFS fs source directory missing"
            exit 1
          fi

          if [ ! -d "$SUSFS_DIR/kernel_patches/include/linux" ]; then
            echo "::error::SUSFS include source directory missing"
            exit 1
          fi

          cp -av "$SUSFS_DIR/kernel_patches/fs/." fs/
          cp -av "$SUSFS_DIR/kernel_patches/include/linux/." include/linux/

          echo "===== DRY RUN SUSFS PATCH ====="

          if ! patch --dry-run --batch -p1 < "$SUSFS_PATCH"; then
            echo "::error::SUSFS kernel patch is incompatible with this source"
            exit 1
          fi

          echo "===== APPLY SUSFS PATCH ====="

          patch --batch -p1 < "$SUSFS_PATCH"

          echo "SUSFS kernel patch applied"

      # ==========================================
      # APPLY SUSFS KSUN PATCH
      # ==========================================

      - name: Apply SUSFS KernelSU-Next Patch
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"

          cd "$KERNEL_DIR"

          echo "===== LOCATE KSUN SOURCE ====="

          if [ ! -e drivers/kernelsu ]; then
            echo "::error::drivers/kernelsu not found"
            exit 1
          fi

          KSUN_KERNEL_DIR="$(realpath drivers/kernelsu)"
          KSUN_ROOT="$(dirname "$KSUN_KERNEL_DIR")"

          echo "KernelSU kernel directory:"
          echo "$KSUN_KERNEL_DIR"

          echo "KernelSU repository root:"
          echo "$KSUN_ROOT"

          echo "===== CHECK BUILT-IN SUSFS ====="

          if grep -RqsE \
            '^[[:space:]]*config KSU_SUSFS([[:space:]]|$)' \
            --include='Kconfig*' \
            "$KSUN_KERNEL_DIR"; then

            echo "KernelSU-Next already contains KSU_SUSFS"
            echo "Skipping separate KernelSU SUSFS patch"

          else
            KSU_PATCH="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

            if [ ! -f "$KSU_PATCH" ]; then
              echo "::error::SUSFS KernelSU patch not found"
              find "$SUSFS_DIR/kernel_patches" -type f -print
              exit 1
            fi

            echo "KernelSU patch:"
            echo "$KSU_PATCH"

            cd "$KSUN_ROOT"

            echo "===== DRY RUN KSUN PATCH ====="

            if ! patch --dry-run --batch -p1 < "$KSU_PATCH"; then
              echo "::error::SUSFS patch does not match KernelSU-Next source"
              exit 1
            fi

            echo "===== APPLY KSUN PATCH ====="

            patch --batch -p1 < "$KSU_PATCH"

            echo "KernelSU SUSFS patch applied"
          fi

          echo "===== VERIFY KSUN SUSFS CONFIG ====="

          if ! grep -RqsE \
            '^[[:space:]]*config KSU_SUSFS([[:space:]]|$)' \
            --include='Kconfig*' \
            "$KSUN_KERNEL_DIR"; then

            echo "::error::KSU_SUSFS Kconfig symbol not found"
            exit 1
          fi

          echo "KSU_SUSFS Kconfig verified"

      # ==========================================
      # DISABLE AUTOMATIC GIT SUFFIX
      # ==========================================

      - name: Disable Automatic Git Kernel Suffix
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          : > .scmversion

          echo "===== SCM VERSION FILE ====="
          ls -l .scmversion

      # ==========================================
      # DOWNLOAD CLANG
      # ==========================================

      - name: Download Selected Clang Toolchain
        shell: bash
        env:
          SELECTED_COMPILER: ${{ inputs.compiler }}
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/clang-toolchain"

          mkdir -p "$CLANG_DIR"

          case "$SELECTED_COMPILER" in

            google)
              echo "Selected: Google Android 14 Clang r487747c"

              CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz"

              curl -fL --retry 5 "$CLANG_URL" \
                -o "$RUNNER_TEMP/google-clang.tar.gz"

              tar -xzf "$RUNNER_TEMP/google-clang.tar.gz" \
                -C "$CLANG_DIR"
              ;;

            aosp-clang-r614150)
              echo "Selected: AOSP Clang r614150"

              AOSP_CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r614150.tar.gz"

              curl -fL --retry 5 "$AOSP_CLANG_URL" \
                -o "$RUNNER_TEMP/aosp-clang-r614150.tar.gz"

              tar -xzf "$RUNNER_TEMP/aosp-clang-r614150.tar.gz" \
                -C "$CLANG_DIR"
              ;;

            llvm-23.1.4)
              echo "Selected: Official LLVM/Clang 23.1.4"

              LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-Linux-X64.tar.xz"

              curl -fL --retry 5 "$LLVM_URL" \
                -o "$RUNNER_TEMP/llvm-23.1.4.tar.xz"

              tar -xJf "$RUNNER_TEMP/llvm-23.1.4.tar.xz" \
                -C "$CLANG_DIR"
              ;;

            neutron-06092026)
              echo "Selected: Neutron Clang 06092026"

              API_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/tags/06092026"

              curl -fL --retry 5 \
                -H "Accept: application/vnd.github+json" \
                "$API_URL" \
                -o "$RUNNER_TEMP/neutron-release.json"

              ASSET_NAME="$(jq -r '
                [.assets[]
                 | select(.size > 10000000)
                 | select(.name | test("\\.(tar\\.xz|tar\\.gz|tar\\.zst|tgz|txz|zip)$"; "i"))
                 | select(.name | test("source"; "i") | not)]
                | sort_by(.size)
                | last
                | .name // empty
              ' "$RUNNER_TEMP/neutron-release.json")"

              if [ -z "$ASSET_NAME" ]; then
                echo "::error::Neutron compiler archive not found"

                jq -r '.assets[] | [.name, .size, .browser_download_url] | @tsv' \
                  "$RUNNER_TEMP/neutron-release.json"

                exit 1
              fi

              ASSET_URL="$(jq -r --arg name "$ASSET_NAME" '
                .assets[]
                | select(.name == $name)
                | .browser_download_url
              ' "$RUNNER_TEMP/neutron-release.json")"

              if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
                echo "::error::Neutron compiler download URL is empty"
                exit 1
              fi

              echo "Neutron asset: $ASSET_NAME"

              curl -fL --retry 5 "$ASSET_URL" \
                -o "$RUNNER_TEMP/neutron-toolchain"

              case "$ASSET_NAME" in

                *.tar.xz|*.txz)
                  tar -xJf "$RUNNER_TEMP/neutron-toolchain" \
                    -C "$CLANG_DIR"
                  ;;

                *.tar.gz|*.tgz)
                  tar -xzf "$RUNNER_TEMP/neutron-toolchain" \
                    -C "$CLANG_DIR"
                  ;;

                *.tar.zst)
                  tar --zstd -xf "$RUNNER_TEMP/neutron-toolchain" \
                    -C "$CLANG_DIR"
                  ;;

                *.zip)
                  unzip -q "$RUNNER_TEMP/neutron-toolchain" \
                    -d "$CLANG_DIR"
                  ;;

                *)
                  echo "::error::Unsupported Neutron archive format"
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "::error::Unknown compiler selection: $SELECTED_COMPILER"
              exit 1
              ;;
          esac

          echo "===== LOCATE CLANG ====="

          CLANG_BIN="$(find -L "$CLANG_DIR" \
            -type f \
            -name clang \
            -print -quit | xargs -r dirname)"

          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::clang executable not found"

            find "$CLANG_DIR" -maxdepth 6 \
              -name 'clang*' -print | head -80

            exit 1
          fi

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy; do
            if [ ! -x "$CLANG_BIN/$tool" ]; then
              echo "::error::Required tool missing: $CLANG_BIN/$tool"
              exit 1
            fi
          done

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "Clang directory: $CLANG_BIN"

      # ==========================================
      # VERIFY CLANG
      # ==========================================

      - name: Verify Selected Clang
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CLANG ====="
          clang --version

          echo "===== LLD ====="
          ld.lld --version

          echo "===== LLVM AR ====="
          llvm-ar --version

          echo "===== LLVM OBJCOPY ====="
          llvm-objcopy --version

      # ==========================================
      # CONFIGURE GKI + KSUN + SUSFS
      # ==========================================

      - name: Configure GKI Defconfig
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          : > .scmversion

          echo "===== GKI DEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          echo "===== ENABLE KERNELSU-NEXT ====="

          if grep -RqsE \
            '^[[:space:]]*config KSU([[:space:]]|$)' \
            --include='Kconfig*' \
            drivers/kernelsu; then

            ./scripts/config --file out/.config \
              -e KSU

          elif grep -RqsE \
            '^[[:space:]]*config KSU_NEXT([[:space:]]|$)' \
            --include='Kconfig*' \
            drivers/kernelsu; then

            ./scripts/config --file out/.config \
              -e KSU_NEXT

          else
            echo "::error::KernelSU Kconfig symbol not found"
            exit 1
          fi

          echo "===== ENABLE SUSFS ====="

          if ! grep -RqsE \
            '^[[:space:]]*config KSU_SUSFS([[:space:]]|$)' \
            --include='Kconfig*' \
            drivers/kernelsu; then

            echo "::error::KSU_SUSFS Kconfig symbol not found"
            exit 1
          fi

          ./scripts/config --file out/.config \
            -e KSU_SUSFS

          echo "===== ENABLE SUSFS MAGIC MOUNT IF AVAILABLE ====="

          if grep -RqsE \
            '^[[:space:]]*config KSU_SUSFS_HAS_MAGIC_MOUNT([[:space:]]|$)' \
            --include='Kconfig*' \
            drivers/kernelsu; then

            ./scripts/config --file out/.config \
              -e KSU_SUSFS_HAS_MAGIC_MOUNT
          fi

          echo "===== CONFIGURE LOCALVERSION AND THINLTO ====="

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "" \
            -d LOCALVERSION_AUTO \
            -e LTO_CLANG \
            -e LTO_CLANG_THIN \
            -d LTO_NONE \
            -d LTO_CLANG_FULL

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            olddefconfig

          echo "===== CONFIG CHECK ====="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN|CONFIG_KSU|CONFIG_KSU_SUSFS' \
            out/.config || true

          echo "===== VERIFY KSUN ====="

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU is not enabled"
            exit 1
          fi

          echo "===== VERIFY SUSFS ====="

          if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "::error::CONFIG_KSU_SUSFS is not enabled"
            exit 1
          fi

          echo "===== VERIFY KERNEL RELEASE ====="

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          echo "Kernel release: $RELEASE"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Unexpected kernel release: $RELEASE"
            exit 1
          fi

      # ==========================================
      # COMPILE KERNEL
      # ==========================================

      - name: Compile Kernel Image and Modules
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          : > .scmversion

          echo "===== BUILD KERNEL ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            Image modules

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo "===== IMAGE SIZE ====="
          ls -lh "$IMAGE"

          echo "===== VMLINUX ====="
          ls -lh out/vmlinux

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          echo "Kernel release: $RELEASE"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Kernel release mismatch: $RELEASE"
            exit 1
          fi

      # ==========================================
      # ANYKERNEL3
      # ==========================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() { '
          kernel.string=Quantum wowoLTS GKI 6.1.182 KSUN SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print ''
          ui_print '   _____                      _                 _ '
          ui_print '  /  _  \  _   _   __ _  _ __ | |_  _   _  _ __ | |'
          ui_print '  | | | | | | | | / _` ||  _ \| __|| | | ||  _ \| |'
          ui_print '  | |_| | | |_| || (_| || | | | |_ | |_| || | | | |'
          ui_print '  \_____/  \__,_| \__,_||_| |_|\__| \__,_||_| |_|_|'
          ui_print ''
          ui_print '       __      __  ____  __        _____  _____'
          ui_print '       \ \    / / / __ \ \ \      / / _ \|_   _|'
          ui_print '        \ \  / / | |  | | \ \ /\ / / | | | | |'
          ui_print '         \ \/ /  | |  | |  \ V  V /| |_| | | |'
          ui_print '          \__/    \____/    \_/\_/  \___/  |_|'
          ui_print ''
          ui_print '  -----------------------------------------------'
          ui_print '     QUANTUM wowoLTS | ANDROID 14 | GKI 6.1'
          ui_print '                KSUN + SUSFS'
          ui_print '  -----------------------------------------------'
          ui_print ''

          split_boot;
          flash_boot;

          ui_print ''
          ui_print '  ========================================='
          ui_print '              BOOOOM!!!'
          ui_print '               COOL YOU'
          ui_print '  ========================================='
          ui_print ''
          ui_print '       QUANTUM wowoLTS'
          ui_print '       KERNEL FLASH SUCCESSFUL'
          ui_print '  ========================================='
          ui_print ''
          AK3EOF

      # ==========================================
      # PACK ZIP
      # ==========================================

      - name: Pack AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd AnyKernel3

          zip -r9 \
            ../release/Wowo-Quantum-Malachite-GKI-6.1.182-KSUN-SUSFS.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

          test -s ../release/Wowo-Quantum-Malachite-GKI-6.1.182-KSUN-SUSFS.zip

          echo "===== ZIP SIZE ====="
          ls -lh ../release/Wowo-Quantum-Malachite-GKI-6.1.182-KSUN-SUSFS.zip

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wowo-Quantum-GKI-6.1.182-KSUN-SUSFS
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/vmlinux
            release/Wowo-Quantum-Malachite-GKI-6.1.182-KSUN-SUSFS.zip
          if-no-files-found: error
          retention-days: 14
