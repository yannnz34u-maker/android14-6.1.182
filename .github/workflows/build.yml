name: Wowo-Quantum - Android 14 GKI 6.1.182

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Select Clang toolchain"
        type: choice
        required: true
        default: aosp-clang-r639965
        options:
          - aosp-clang-r639965
          - llvm-23.1.4
          - neutron-06092026

permissions:
  contents: read

jobs:
  build:
    name: Wowo-Quantum GKI 6.1.182 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KBUILD_BUILD_USER: userbuild
      KBUILD_BUILD_HOST: yannn34u

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: yannnz34u-maker/android14-6.1.182
          ref: main
          fetch-depth: 0
          path: kernel

      - name: Disable Automatic Git Kernel Suffix
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          : > .scmversion
          echo "===== SCM VERSION ====="
          ls -l .scmversion

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          VERSION="$(make -s kernelversion)"
          echo "$VERSION"

          if [ "$VERSION" != "6.1.182" ]; then
            echo "::error::Expected kernel 6.1.182, found $VERSION"
            exit 1
          fi

          test -f Makefile
          test -d arch/arm64
          test -d scripts

          echo "Kernel source verified: $VERSION"

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git curl wget \
            zip unzip jq libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip pahole lz4 zstd \
            device-tree-compiler rsync ccache xz-utils

      - name: Download Selected Clang Toolchain
        shell: bash
        env:
          SELECTED_COMPILER: ${{ inputs.compiler }}
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/clang-toolchain"
          mkdir -p "$CLANG_DIR"

          case "$SELECTED_COMPILER" in
            aosp-clang-r639965)
              echo "Selected: Official AOSP Clang r639965 (24.0.1)"

              CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r639965.tar.gz"

              curl -fL --retry 5 \
                "$CLANG_URL" \
                -o "$RUNNER_TEMP/aosp-clang-r639965.tar.gz"

              tar -xzf "$RUNNER_TEMP/aosp-clang-r639965.tar.gz" \
                -C "$CLANG_DIR"
              ;;

            llvm-23.1.4)
              echo "Selected: Official LLVM/Clang 23.1.4"

              LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-Linux-X64.tar.xz"

              curl -fL --retry 5 \
                "$LLVM_URL" \
                -o "$RUNNER_TEMP/llvm-23.1.4.tar.xz"

              tar -xJf "$RUNNER_TEMP/llvm-23.1.4.tar.xz" \
                -C "$CLANG_DIR"
              ;;

            neutron-06092026)
              echo "Selected: Neutron Clang build 06092026"

              API_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/tags/06092026"

              curl -fL --retry 5 \
                -H "Accept: application/vnd.github+json" \
                "$API_URL" \
                -o "$RUNNER_TEMP/neutron-release.json"

              ASSET_NAME="$(jq -r '
                [.assets[]
                 | select(.size > 10000000)
                 | select(.name | test("\\.(tar\\.xz|tar\\.gz|tar\\.zst|tgz|txz|zip)$"; "i"))
                 | select(.name | test("source"; "i") | not)]
                | sort_by(.size)
                | last
                | .name // empty
              ' "$RUNNER_TEMP/neutron-release.json")"

              ASSET_URL="$(jq -r --arg name "$ASSET_NAME" '
                .assets[]
                | select(.name == $name)
                | .browser_download_url
              ' "$RUNNER_TEMP/neutron-release.json")"

              if [ -z "$ASSET_NAME" ] || [ -z "$ASSET_URL" ]; then
                echo "::error::Could not identify Neutron compiler archive in release 06092026"

                jq -r '.assets[] | [.name, .size, .browser_download_url] | @tsv' \
                  "$RUNNER_TEMP/neutron-release.json"

                exit 1
              fi

              echo "Neutron asset: $ASSET_NAME"

              curl -fL --retry 5 "$ASSET_URL" \
                -o "$RUNNER_TEMP/neutron-toolchain"

              case "$ASSET_NAME" in
                *.tar.xz|*.txz)
                  tar -xJf "$RUNNER_TEMP/neutron-toolchain" -C "$CLANG_DIR"
                  ;;
                *.tar.gz|*.tgz)
                  tar -xzf "$RUNNER_TEMP/neutron-toolchain" -C "$CLANG_DIR"
                  ;;
                *.tar.zst)
                  tar --zstd -xf "$RUNNER_TEMP/neutron-toolchain" -C "$CLANG_DIR"
                  ;;
                *.zip)
                  unzip -q "$RUNNER_TEMP/neutron-toolchain" -d "$CLANG_DIR"
                  ;;
                *)
                  echo "::error::Unsupported Neutron archive format: $ASSET_NAME"
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "::error::Unknown compiler selection: $SELECTED_COMPILER"
              exit 1
              ;;
          esac

          CLANG_BIN="$(find "$CLANG_DIR" \
            \( -type f -o -type l \) \
            -name clang -print -quit | xargs -r dirname)"

          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::clang executable not found in downloaded toolchain"

            find "$CLANG_DIR" -maxdepth 5 -name 'clang*' -print | head -50

            exit 1
          fi

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy; do
            if [ ! -x "$CLANG_BIN/$tool" ]; then
              echo "::error::Required tool missing: $CLANG_BIN/$tool"
              exit 1
            fi
          done

          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Verify Selected Clang
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CLANG ====="
          clang --version

          echo "===== LLD ====="
          ld.lld --version

          echo "===== LLVM AR ====="
          llvm-ar --version

          echo "===== LLVM OBJCOPY ====="
          llvm-objcopy --version

      - name: Configure GKI Defconfig
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          rm -f localversion localversion.*
          : > .scmversion

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          echo "===== CONFIGURE LOCALVERSION AND THINLTO ====="

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "" \
            -d LOCALVERSION_AUTO \
            -e LTO_CLANG \
            -e LTO_CLANG_THIN \
            -d LTO_NONE \
            -d LTO_CLANG_FULL

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            olddefconfig

          echo "===== CONFIG CHECK ====="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN|CONFIG_LTO_NONE' \
            out/.config || true

          echo "===== VERIFY KERNEL RELEASE ====="

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          echo "Kernel release: $RELEASE"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Unexpected kernel release: $RELEASE"
            exit 1
          fi

      - name: Compile Kernel Image and Modules
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          : > .scmversion

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            Image modules

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo "===== IMAGE SIZE ====="
          ls -lh "$IMAGE"

          RELEASE="$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease)"

          echo "Kernel release: $RELEASE"

          if [ "$RELEASE" != "6.1.182-Wowo-Quantum" ]; then
            echo "::error::Kernel release mismatch: $RELEASE"
            exit 1
          fi

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() { '
          kernel.string=Quantum wowoLTS GKI 6.1.182
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print ''
          ui_print '   _____                      _                 _ '
          ui_print '  /  _  \  _   _   __ _  _ __ | |_  _   _  _ __ | |'
          ui_print '  | | | | | | | | / _` ||  _ \| __|| | | ||  _ \| |'
          ui_print '  | |_| | | |_| || (_| || | | | |_ | |_| || | | | |'
          ui_print '  \_____/  \__,_| \__,_||_| |_|\__| \__,_||_| |_|_|'
          ui_print ''
          ui_print '       __      __  ____  __        _____  _____'
          ui_print '       \ \    / / / __ \ \ \      / / _ \|_   _|'
          ui_print '        \ \  / / | |  | | \ \ /\ / / | | | | |'
          ui_print '         \ \/ /  | |  | |  \ V  V /| |_| | | |'
          ui_print '          \__/    \____/    \_/\_/  \___/  |_|'
          ui_print ''
          ui_print '  -----------------------------------------------'
          ui_print '     QUANTUM wowoLTS | ANDROID 14 | GKI 6.1'
          ui_print '  -----------------------------------------------'
          ui_print ''

          split_boot;
          flash_boot;

          ui_print ''
          ui_print '  ========================================='
          ui_print '              BOOOOM!!!'
          ui_print '               COOL YOU'
          ui_print '  ========================================='
          ui_print ''
          ui_print '       QUANTUM wowoLTS'
          ui_print '       KERNEL FLASH SUCCESSFUL'
          ui_print '  ========================================='
          ui_print ''
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd AnyKernel3

          zip -r9 \
            ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

          test -s ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wowo-Quantum-GKI-6.1.182
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/vmlinux
            release/Wowo-Quantum-Malachite-GKI-6.1.182.zip
          retention-days: 14
