
name: Wowo-Quantum - Android 14 GKI 6.1.182

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wowo-Quantum GKI 6.1.182 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KBUILD_BUILD_USER: userbuild
      KBUILD_BUILD_HOST: yannn34u
      LOCALVERSION: -Wowo-Quantum

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: yannnz34u-maker/android14-6.1.182
          ref: main
          fetch-depth: 0
          path: kernel

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          VERSION="$(make -s kernelversion)"
          echo "$VERSION"

          if [ "$VERSION" != "6.1.182" ]; then
            echo "::error::Expected kernel 6.1.182, found $VERSION"
            exit 1
          fi

          echo "===== SOURCE CHECK ====="
          test -f Makefile
          test -d arch/arm64
          test -d scripts

          echo "Kernel source verified: $VERSION"

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            wget \
            zip \
            unzip \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            python3-pip \
            pahole \
            lz4 \
            device-tree-compiler \
            rsync \
            ccache \
            xz-utils

      - name: Download Google Android 14 Clang
        shell: bash
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/google-clang"
          mkdir -p "$CLANG_DIR"

          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz"

          curl -fL --retry 5 \
            "$CLANG_URL" \
            -o "$RUNNER_TEMP/google-clang.tar.gz"

          tar -xzf "$RUNNER_TEMP/google-clang.tar.gz" \
            -C "$CLANG_DIR"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Verify Google Clang
        shell: bash
        run: |
          set -euo pipefail

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-objcopy --version

      - name: Configure GKI Defconfig
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            gki_defconfig

          echo "===== CONFIGURE THINLTO ====="

          ./scripts/config --file out/.config \
            -e LTO_CLANG \
            -e LTO_CLANG_THIN \
            -d LTO_NONE \
            -d LTO_CLANG_FULL

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            olddefconfig

          echo "===== LTO CONFIG ====="
          grep -E \
            'CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN|CONFIG_LTO_NONE' \
            out/.config || true

      - name: Compile Kernel Image and Modules
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            Image modules

          echo "===== VERIFY IMAGE ====="

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo "===== IMAGE SIZE ====="
          ls -lh "$IMAGE"

          echo "===== KERNEL RELEASE ====="
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION=-Wowo-Quantum \
            kernelrelease

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() { '
          kernel.string=Quantum wowoLTS GKI 6.1.182
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print ''
          ui_print '   _____                      _                 _ '
          ui_print '  /  _  \  _   _   __ _  _ __ | |_  _   _  _ __ | |'
          ui_print '  | | | | | | | | / _` ||  _ \| __|| | | ||  _ \| |'
          ui_print '  | |_| | | |_| || (_| || | | | |_ | |_| || | | | |'
          ui_print '  \_____/  \__,_| \__,_||_| |_|\__| \__,_||_| |_|_|'
          ui_print ''
          ui_print '       __      __  ____  __        _____  _____'
          ui_print '       \ \    / / / __ \ \ \      / / _ \|_   _|'
          ui_print '        \ \  / / | |  | | \ \ /\ / / | | | | |'
          ui_print '         \ \/ /  | |  | |  \ V  V /| |_| | | |'
          ui_print '          \__/    \____/    \_/\_/  \___/  |_|'
          ui_print ''
          ui_print '  -----------------------------------------------'
          ui_print '     QUANTUM wowoLTS | ANDROID 14 | GKI 6.1'
          ui_print '  -----------------------------------------------'
          ui_print ''

          split_boot;
          flash_boot;

          ui_print ''
          ui_print '  ========================================='
          ui_print '              BOOOOM!!!'
          ui_print '               COOL YOU'
          ui_print '  ========================================='
          ui_print ''
          ui_print '       QUANTUM wowoLTS'
          ui_print '       KERNEL FLASH SUCCESSFUL'
          ui_print '  ========================================='
          ui_print ''
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd AnyKernel3

          zip -r9 \
            ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

          test -s ../release/Wowo-Quantum-Malachite-GKI-6.1.182.zip

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wowo-Quantum-GKI-6.1.182
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/vmlinux
            release/Wowo-Quantum-Malachite-GKI-6.1.182.zip
          retention-days: 14
